[project]
name = "noted"
version = "0.1.0"
description = "Reads FIA stewards' documents and explains each ruling against the rule and the precedent."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "selectolax>=1.0",
    "pymupdf>=1.24",
    "typer>=0.12",
]

[project.scripts]
noted = "noted.cli:app"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["noted"]

[tool.pytest.ini_options]
testpaths = ["tests"]
